<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Eine Holzkugel für Winti</title>
<desc id="desc">Visualisierung einer naturbelassenen Holzkugel auf einem warmen Holztisch</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#ebeee1"/><stop offset=".55" stop-color="#dfe5d2"/><stop offset="1" stop-color="#c4d2be"/></linearGradient>
