<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
<title id="title">Winti-Holzkugel – Visualisierung eines Dankeschöns</title>
<desc id="description">Hochwertig gestaltete, naturfarbene Holzkugel mit graviertem WINTI-Schriftzug, Winterthurer Stadt-Silhouette und einer stilisierten Kugelrinne, auf einem Waldholzsockel.</desc>
<defs>
 <linearGradient id="forest" x1="0" x2="1" y1=".05" y2="1">
  <stop stop-color="#d8dfce"/><stop offset=".43" stop-color="#e2dfcd"/><stop offset="1" stop-color="#8c9f80"/>
 </linearGradient>
 <radialGradient id="light" cx="33%" cy="18%" r="72%">
  <stop stop-color="#ffdf9b"/><stop offset=".25" stop-color="#ecc18a"/>
  <stop offset=".59" stop-color="#cf975b"/><stop offset=".81" stop-color="#af713e"/>
  <stop offset=".96" stop-color="#714025"/><stop offset="1" stop-color="#40261b"/>
 </radialGradient>
 <linearGradient id="table" x1="0" x2=".2" y1="0" y2="1">
  <stop stop-color="#d4ac7a"/><stop offset=".26" stop-color="#b67d4c"/><stop offset=".8" stop-color="#805032"/><stop offset="1" stop-color="#5e3828"/>
 </linearGradient>
 <linearGradient id="wood-gold" x1="0" x2="1" y1="0" y2="1">
  <stop stop-color="#fff0c6"/><stop offset=".5" stop-color="#bd8151"/><stop offset="1" stop-color="#7c4a27"/>
 </linearGradient>
 <radialGradient id="vignette"><stop offset=".56" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#192819" stop-opacity=".3"/></radialGradient>
 <filter id="blur20"><feGaussianBlur stdDeviation="22"/></filter>
 <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
 <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur stdDeviation="16"/>
 </filter>
 <filter id="wood-noise" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency=".085 .04" numOctaves="4" seed="8" result="noise"/>
  <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
  <feComponentTransfer in="mono"><feFuncA type="linear" slope=".14"/></feComponentTransfer>
 </filter>
 <clipPath id="ballclip"><circle cx="606" cy="372" r="292"/></clipPath>
 <filter id="engrave" x="-30%" y="-50%" width="160%" height="200%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="edged"/>
  <feOffset in="edged" dx="1.6" dy="2.2" result="lower"/>
  <feMerge><feMergeNode in="lower"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
</defs>
<rect width="1200" height="800" fill="url(#forest)"/>
<g filter="url(#blur20)" opacity=".67">
 <ellipse cx="1042" cy="150" rx="170" ry="270" fill="#5e7656"/>
 <ellipse cx="110" cy="130" rx="230" ry="290" fill="#a4b8a0"/>
 <circle cx="958" cy="155" r="85" fill="#e9e6b3"/>
 <circle cx="245" cy="100" r="65" fill="#f5eaca"/>
 <circle cx="125" cy="370" r="120" fill="#78926f"/>
 <circle cx="1115" cy="465" r="130" fill="#789268"/>
</g>
<rect y="654" width="1200" height="146" fill="url(#table)"/>
<path d="M0 655C225 628 337 677 620 654S1030 640 1200 655" fill="none" stroke="#edd1a4" stroke-width="8" opacity=".7"/>
<g fill="none" stroke="#40291a" stroke-width="2" opacity=".25">
 <path d="M0 698C350 668 640 705 1200 681"/>
 <path d="M0 722C350 701 642 727 1200 704"/>
 <path d="M0 761C350 729 655 778 1200 744"/>
</g>
<ellipse cx="612" cy="664" rx="309" ry="43" fill="#2d231b" opacity=".44" filter="url(#softShadow)"/>
<circle cx="606" cy="372" r="292" fill="url(#light)"/>
<g clip-path="url(#ballclip)">
 <g opacity=".27" stroke="#7c4927" stroke-width="3" fill="none">
  <path d="M310 185C499 62 757 111 853 296C934 450 874 608 808 691"/>
  <path d="M310 205C504 88 739 135 826 308C903 457 866 594 785 682"/>
  <path d="M310 236C489 118 725 165 799 328C872 454 833 593 757 672"/>
  <path d="M305 260C476 153 697 197 776 345C842 461 800 584 737 660"/>
  <path d="M316 288C459 183 682 210 752 358C816 469 773 580 718 660"/>
  <path d="M316 315C453 222 658 236 731 373C779 487 751 590 697 657"/>
  <path d="M310 351C434 255 632 278 704 388C755 491 719 600 661 652"/>
  <path d="M315 390C434 298 601 316 677 416C708 490 692 592 632 654"/>
  <path d="M320 434C431 356 579 359 639 457C670 532 653 594 604 655"/>
 </g>
 <g opacity=".18" fill="none" stroke="#fff6e4" stroke-width="3">
  <path d="M309 189C494 75 738 106 835 293"/><path d="M310 261C486 142 696 201 776 343"/>
  <path d="M313 321C450 228 656 237 731 378"/><path d="M315 393C433 306 606 315 672 416"/>
 </g>
 <rect x="300" y="80" width="640" height="620" fill="#734122" opacity=".18" filter="url(#wood-noise)"/>
 <ellipse cx="506" cy="221" rx="135" ry="102" fill="#fff6d6" opacity=".24" filter="url(#blur20)"/>
 <g opacity=".2" fill="none" stroke="#56301b" stroke-width="1">
  <path d="M341 380C500 240 780 295 839 460"/>
  <path d="M343 395C504 266 759 306 827 464"/>
  <path d="M349 420C514 299 736 325 808 477"/>
 </g>
 <!-- Winterthur-inspired two-lion heraldry, a decorative reinterpretation,
      NOT the official Stadt Winterthur corporate logo. -->
 <defs>
  <g id="winti-lion">
    <path d="M-65-2C-79-12-85-36-75-48C-72-60-54-62-47-50C-36-34-52-19-43-14
      C-34-38-17-50 10-47C23-46 29-31 37-30L45-41L55-31L51-20L66-19
      L78-9L66-3L55-7C60 8 55 22 38 28L16 26L-10 32L-35 20Z" fill="#a92821"/>
    <path d="M37-30L44-45L49-32L59-39L61-24L69-18L80-19L88-10L78-5L64-7L57-1
      L42-4L37-15" fill="#9c241e"/>
    <path d="M-27-22L-60-51L-69-50L-70-42L-78-46L-84-41L-91-49L-83-61L-74-62
      L-68-69L-55-67L-47-53L-9-37" fill="#ad2821"/>
    <path d="M-18 19L-19 54L-39 65L-50 53L-42 46L-47 34L-34 14Z" fill="#a22620"/>
    <path d="M5 24L17 60L8 70L-2 63L-10 68L-21 60L-10 51L-16 26Z" fill="#a22620"/>
    <path d="M34 19L51 48L68 46L72 58L61 67L47 65L40 73L27 62L35 53L21 27Z" fill="#a22620"/>
    <path d="M-35 3L-64 21L-82 12L-83 1L-73-5L-62 5L-46-9Z" fill="#a22620"/>
    <path d="M-62 13L-77 27L-87 25L-90 17L-85 9" stroke="#8c201b" stroke-width="4" fill="none"/>
    <path d="M-36 45L-48 58M-17 54L-27 63M4 56L-3 66M58 54L68 57" stroke="#5f2319" stroke-width="3" fill="none"/>
    <circle cx="58" cy="-21" r="3.5" fill="#f2cd95"/>
    <path d="M68-10L80-10M-50-13L-40-24" stroke="#5b261a" stroke-width="3" fill="none"/>
    <path d="M15-41L9-51M24-36L23-51M34-28L39-42M14 16L1 8L-9 16" stroke="#711e1c" stroke-width="4" fill="none"/>
  </g>
 </defs>
 <g opacity=".97" filter="url(#engrave)">
   <use href="#winti-lion" transform="translate(520 276) scale(1.16)"/>
   <path d="M639 194 L680 194 L565 359 L526 359Z" fill="#a92821" opacity=".96"/>
   <use href="#winti-lion" transform="translate(687 534) scale(1.06)"/>
   <path d="M563 482 L603 482 L490 646 L451 646Z" fill="#a92821" opacity=".96"/>
 </g>
 <path d="M448 360Q606 374 765 357" fill="none" stroke="#fff1cf" stroke-opacity=".3" stroke-width="4"/>
 <text x="607" y="454" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="100" font-weight="950" letter-spacing="1.2" fill="#f8ddac" opacity=".56" transform="translate(-1,-3)">WINTI.</text>
 <text x="606" y="454" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="100" font-weight="950" letter-spacing="1.2" fill="#382820">WINTI.</text>

</g>
<circle cx="606" cy="372" r="291" fill="none" stroke="#fbe6b5" stroke-width="2" opacity=".34"/>
<rect width="1200" height="800" fill="url(#vignette)"/>
</svg>